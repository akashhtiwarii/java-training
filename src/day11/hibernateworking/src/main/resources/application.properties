spring.application.name=hibernateworking
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.event.internal.DefaultFlushEventListener=DEBUG
logging.level.org.hibernate.engine.internal.StatefulPersistenceContext=DEBUG
logging.level.org.hibernate.engine.spi.ActionQueue=DEBUG